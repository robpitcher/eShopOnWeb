# Agentic Modernization Pipeline — Stages 1–3
#
# Sequential pipeline that runs specialist agents to:
#   Stage 1: Document the repo (inventory)
#   Stage 2: Generate characterization tests (behavioral lock-in)
#   Stage 3: Run upgrade assessment (analysis only, no code changes)
#
# Each stage writes artifacts to docs/modernization/stage-N/ on a working
# branch. Handoffs between stages are files committed to that branch.
# Contract gates at the top of downstream jobs verify upstream output.
#
# See: docs/prd.md for the full spec.
# See: .github/prompts/stage-*.md for agent prompts (work items #2–4).

name: Modernize Pipeline (Stages 1–3)

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: "Base branch to modernize from"
        required: false
        default: "main"
        type: string
      dotnet-version-override:
        description: "Target .NET version for assessment (default: 9.0)"
        required: false
        default: "9.0"
        type: string

# Permissions needed for branch operations and PR creation
permissions:
  contents: write
  pull-requests: write

# Only one modernization run at a time
concurrency:
  group: modernize-pipeline
  cancel-in-progress: false

env:
  WORKING_BRANCH: "modernize/${{ github.run_id }}"
  TARGET_DOTNET: "${{ inputs.dotnet-version-override || '9.0' }}"
  ARTIFACT_ROOT: "docs/modernization"

jobs:
  # ============================================================
  # Stage 1 — Documentation Inventory
  # ============================================================
  stage-1-docs:
    name: "Stage 1: Documentation Inventory"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-branch || 'main' }}
          fetch-depth: 0

      - name: Create working branch
        run: |
          git checkout -b "${{ env.WORKING_BRANCH }}"
          git push -u origin "${{ env.WORKING_BRANCH }}"

      - name: Ensure artifact directories exist
        run: |
          mkdir -p "${{ env.ARTIFACT_ROOT }}/stage-1"
          mkdir -p "${{ env.ARTIFACT_ROOT }}/stage-2"
          mkdir -p "${{ env.ARTIFACT_ROOT }}/stage-3"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Runs the Copilot CLI in autopilot mode with the stage 1 prompt.
      # The agent reads the repo structure and produces
      # docs/modernization/stage-1/inventory.md (analysis only, no code changes).
      #
      # Auth: GITHUB_TOKEN is used by default. If your org requires a PAT
      # with Copilot scope, create a COPILOT_TOKEN repo secret and it will
      # be preferred automatically.
      - name: Invoke Stage 1 documentation agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat .github/prompts/stage-1-documentation.md)
          copilot --autopilot --yolo --max-autopilot-continues 30 \
            -p "$PROMPT"

      - name: Commit and push stage 1 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/modernization/stage-1/
          if git diff --cached --quiet; then
            echo "::error::Stage 1 agent did not produce any artifacts in docs/modernization/stage-1/"
            exit 1
          fi
          git commit -m "Stage 1: Documentation inventory [run #${{ github.run_id }}]"
          git push

  # ============================================================
  # Stage 2 — Characterization Tests
  # ============================================================
  stage-2-tests:
    name: "Stage 2: Characterization Tests"
    runs-on: ubuntu-latest
    needs: stage-1-docs

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKING_BRANCH }}
          fetch-depth: 0

      # ---------------------------------------------------------
      # Contract gate — validate stage 1 output (work item #5)
      # ---------------------------------------------------------
      # Downstream-validates-upstream: if Stage 1 didn't produce
      # a complete inventory, we fail here with an exact reason.
      # Section headings must match .github/prompts/stage-1-documentation.md.
      - name: "Contract gate — validate stage 1 inventory"
        run: |
          INVENTORY="docs/modernization/stage-1/inventory.md"
          FAILED=0

          # --- File existence check ---
          if [ ! -f "$INVENTORY" ]; then
            echo "::error::CONTRACT GATE FAILED: Stage 1 inventory file missing — expected '$INVENTORY'"
            exit 1
          fi

          echo "✓ Inventory file exists: $INVENTORY"

          # --- Required section checks ---
          # These headings are declared in .github/prompts/stage-1-documentation.md
          SECTIONS=(
            "## Projects and Target Frameworks"
            "## Dependencies"
            "## External I/O"
            "## Configuration Surface"
            "## Entry Points"
            "## Upgrade Risks"
          )

          for section in "${SECTIONS[@]}"; do
            if ! grep -qF "$section" "$INVENTORY"; then
              echo "::error::CONTRACT GATE FAILED: Stage 1 inventory missing required section '$section'"
              FAILED=1
            else
              echo "✓ Found required section: $section"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::CONTRACT GATE FAILED: One or more required sections are missing from $INVENTORY"
            exit 1
          fi

          echo ""
          echo "✅ Contract gate passed — Stage 1 inventory is complete (6/6 sections present)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Runs the Copilot CLI in autopilot mode with the stage 2 prompt.
      # The agent reads the stage 1 inventory and generates characterization
      # tests in tests/CharacterizationTests/ plus a baseline document in
      # docs/modernization/stage-2/baseline.md.
      #
      # Auth: same pattern as stage 1 — prefer COPILOT_TOKEN if set.
      - name: Invoke Stage 2 characterization-test agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat .github/prompts/stage-2-characterization-tests.md)
          copilot --autopilot --yolo --max-autopilot-continues 30 \
            -p "$PROMPT"

      # .NET SDK is needed to build and run the generated tests.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      # Critical gate: characterization tests must pass against the current
      # codebase before we commit anything. If tests fail here, the stage
      # fails — this is the behavioral lock-in.
      - name: Run characterization tests
        run: dotnet test tests/CharacterizationTests/ --configuration Release --verbosity normal

      - name: Commit and push stage 2 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/CharacterizationTests/ docs/modernization/stage-2/
          if git diff --cached --quiet; then
            echo "::error::Stage 2 agent did not produce any artifacts in tests/CharacterizationTests/ or docs/modernization/stage-2/"
            exit 1
          fi
          git commit -m "Stage 2: Characterization tests [run #${{ github.run_id }}]"
          git push

  # ============================================================
  # Stage 3 — Upgrade Assessment
  # ============================================================
  stage-3-assessment:
    name: "Stage 3: Upgrade Assessment"
    runs-on: ubuntu-latest
    needs: stage-2-tests

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKING_BRANCH }}
          fetch-depth: 0

      # ---------------------------------------------------------
      # Contract gate — validate stage 2 output (work item #6)
      # ---------------------------------------------------------
      # Stage 3 cannot proceed unless stage 2 produced:
      #   1. A characterization test project with at least one .cs file
      #   2. A baseline document with all required sections
      # Fails loud with a named error identifying the specific gap.
      - name: "Contract gate — validate stage 2 artifacts"
        run: |
          GATE_PASS=true

          # --- Check 1: CharacterizationTests directory with .cs files ---
          if [ ! -d "tests/CharacterizationTests" ]; then
            echo "::error::CONTRACT GATE FAILED: Stage 2 test project directory missing — 'tests/CharacterizationTests/' not found"
            GATE_PASS=false
          else
            CS_COUNT=$(find tests/CharacterizationTests -name '*.cs' | wc -l)
            if [ "$CS_COUNT" -eq 0 ]; then
              echo "::error::CONTRACT GATE FAILED: Stage 2 test project contains no .cs files — 'tests/CharacterizationTests/' has zero C# source files"
              GATE_PASS=false
            else
              echo "✓ tests/CharacterizationTests/ exists with ${CS_COUNT} .cs file(s)"
            fi
          fi

          # --- Check 2: baseline.md exists ---
          BASELINE="docs/modernization/stage-2/baseline.md"
          if [ ! -f "$BASELINE" ]; then
            echo "::error::CONTRACT GATE FAILED: Stage 2 baseline document missing — '${BASELINE}' not found"
            GATE_PASS=false
          else
            echo "✓ ${BASELINE} exists"

            # --- Check 3: Required sections in baseline.md ---
            # Section headings defined in .github/prompts/stage-2-characterization-tests.md
            REQUIRED_SECTIONS=(
              "## Summary"
              "## Covered Behavior"
              "## Explicitly NOT Covered"
              "## Test Execution"
            )
            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -q "^${section}" "$BASELINE"; then
                echo "::error::CONTRACT GATE FAILED: Stage 2 baseline missing required section '${section}'"
                GATE_PASS=false
              else
                echo "✓ Found required section: ${section}"
              fi
            done
          fi

          # --- Final verdict ---
          if [ "$GATE_PASS" = false ]; then
            echo ""
            echo "Stage 3 cannot proceed — stage 2 contract not satisfied."
            exit 1
          fi

          echo ""
          echo "✅ Contract gate passed — all stage 2 artifacts validated. Stage 3 may proceed."

      # ---------------------------------------------------------
      # PLACEHOLDER: Agent invocation for Stage 3
      # ---------------------------------------------------------
      # Work item #4 (stage-3 prompt) and #10 (stage-3 wiring) will
      # replace this step.
      #
      # The agent should:
      #   - Invoke the modernize-dotnet custom agent's assessment phase
      #   - Target: .NET ${{ env.TARGET_DOTNET }}
      #   - Produce docs/modernization/stage-3/assessment.md
      #   - Assessment only — no planning, no code execution
      #
      # Prompt file: .github/prompts/stage-3-upgrade-assessment.md
      - name: "[PLACEHOLDER] Invoke Stage 3 agent"
        run: |
          echo "::notice::Stage 3 agent invocation placeholder — see work items #4 and #10"
          echo "TODO: Invoke coding agent with .github/prompts/stage-3-upgrade-assessment.md"
          echo "Target .NET version: ${{ env.TARGET_DOTNET }}"

      # ---------------------------------------------------------
      # PLACEHOLDER: Commit and push stage 3 artifacts
      # ---------------------------------------------------------
      # Work item #10 finalizes this step.
      - name: "[PLACEHOLDER] Commit stage 3 artifacts"
        run: |
          echo "::notice::Artifact commit placeholder — see work item #10"
          echo "TODO: git add docs/modernization/stage-3/ && git commit && git push"

  # ============================================================
  # Summary PR — Collect results and open/update a pull request
  # ============================================================
  summary-pr:
    name: "Summary: Create/Update PR"
    runs-on: ubuntu-latest
    needs: [stage-1-docs, stage-2-tests, stage-3-assessment]
    # Run even if upstream jobs fail, so we still get a PR with partial results
    if: always() && needs.stage-1-docs.result != 'cancelled'

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKING_BRANCH }}
          fetch-depth: 0

      - name: Build PR body
        id: pr-body
        env:
          STAGE_1_RESULT: ${{ needs.stage-1-docs.result }}
          STAGE_2_RESULT: ${{ needs.stage-2-tests.result }}
          STAGE_3_RESULT: ${{ needs.stage-3-assessment.result }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO: "${{ github.repository }}"
          BRANCH: "${{ env.WORKING_BRANCH }}"
        run: |
          # Map result strings to status emojis
          status_icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "⚠️" ;;
            esac
          }

          S1=$(status_icon "$STAGE_1_RESULT")
          S2=$(status_icon "$STAGE_2_RESULT")
          S3=$(status_icon "$STAGE_3_RESULT")

          # Count successes
          PASS=0
          for r in "$STAGE_1_RESULT" "$STAGE_2_RESULT" "$STAGE_3_RESULT"; do
            [ "$r" = "success" ] && PASS=$((PASS + 1))
          done

          # Build the markdown body
          cat > pr_body.md <<PREOF
          ## 🤖 Automated Modernization Pipeline Run

          This pull request was created automatically by the **Modernize Pipeline (Stages 1–3)** workflow.
          It contains artifacts produced by each pipeline stage on the \`${BRANCH}\` working branch.

          ### Stage Results

          | Stage | Job | Result |
          |-------|-----|--------|
          | 1 | Documentation Inventory | ${S1} \`${STAGE_1_RESULT}\` |
          | 2 | Characterization Tests  | ${S2} \`${STAGE_2_RESULT}\` |
          | 3 | Upgrade Assessment      | ${S3} \`${STAGE_3_RESULT}\` |

          **${PASS} of 3** stages completed successfully.

          ### Artifact Files

          The following artifact files were produced (links resolve once merged or on the working branch):

          - 📄 [Stage 1 — Inventory](https://github.com/${REPO}/blob/${BRANCH}/docs/modernization/stage-1/inventory.md)
          - 📄 [Stage 2 — Baseline](https://github.com/${REPO}/blob/${BRANCH}/docs/modernization/stage-2/baseline.md)
          - 📄 [Stage 3 — Assessment](https://github.com/${REPO}/blob/${BRANCH}/docs/modernization/stage-3/assessment.md)

          ### Workflow Run

          🔗 [View workflow run](${RUN_URL})

          ---
          > **Note:** Stages that did not succeed may not have produced their artifact files.
          > Review the workflow run logs for details on any failures.
          PREOF

          # Dedent — the heredoc above is indented for YAML readability
          sed -i 's/^          //' pr_body.md

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.target-branch || 'main' }}
        run: |
          PR_TITLE="Modernization Pipeline Run #${{ github.run_id }}"

          # Check if a PR already exists for this working branch
          EXISTING_PR=$(gh pr list \
            --head "${{ env.WORKING_BRANCH }}" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "::notice::Updating existing PR #${EXISTING_PR}"
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file pr_body.md
          else
            echo "::notice::Creating new PR"
            gh pr create \
              --title "$PR_TITLE" \
              --body-file pr_body.md \
              --base "$TARGET_BRANCH" \
              --head "${{ env.WORKING_BRANCH }}"
          fi

      - name: Clean up temp files
        if: always()
        run: rm -f pr_body.md
